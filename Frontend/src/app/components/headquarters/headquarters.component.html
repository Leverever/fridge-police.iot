<div class="hq-page">
  <form [formGroup]="form">
    <mat-tab-group>
      <mat-tab label="Picture">
        <div class="picture-page">
        <div class="pic-settings">
          <mat-slide-toggle [labelPosition]="'before'" formControlName="withFlash">Use flash</mat-slide-toggle>
          <mat-slide-toggle [labelPosition]="'before'" formControlName="autoUpdate">Auto refresh</mat-slide-toggle>
          <div class="dual-controls">
            <button mat-button (click)="SetData(false)">Save settings</button>
            <button mat-flat-button (click)="SetData()">Take picture</button>
          </div>
        </div>
        <div class="report-card">
          <app-report-card [espReport]="espReports[0]"></app-report-card>
        </div>
        </div>
      </mat-tab>
      <mat-tab label="Temperature">
      </mat-tab>
    </mat-tab-group>
  </form>
  <canvas id="temp-chart"></canvas>
</div>
