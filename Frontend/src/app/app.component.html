<div class="app-page">
  <div class="nav-bar">
    <div class="pattern"></div>
    <div class="title">
      <mat-icon>
        local_police
      </mat-icon>
      <h1>{{title.toUpperCase()}}</h1>
    </div>
    <div class="links">
      <a mat-button routerLink="/hq" [routerLinkActive]="['active-link']">HQ</a>
      <a mat-button routerLink="/archives" [routerLinkActive]="['active-link']">ARCHIVES</a>
    </div>
  </div>
  @if (crtitical)
  {
    <div class="critical-info">
      <mat-icon>warning</mat-icon>
      <h3>Your fridge is above it's allowed temperature</h3>
    </div>
  }
  <div class="routed-content">
    <router-outlet></router-outlet>
  </div>
</div>
